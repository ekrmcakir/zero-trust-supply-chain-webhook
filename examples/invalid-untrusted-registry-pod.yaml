apiVersion: v1
kind: Pod
metadata:
  name: untrusted-registry-violation
  namespace: default
spec:
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
  containers:
    - name: crypto-miner
      image: docker.io/malicious-org/crypto-miner:v1.2.0
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop:
            - ALL
