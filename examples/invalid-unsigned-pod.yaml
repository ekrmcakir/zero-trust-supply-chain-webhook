apiVersion: v1
kind: Pod
metadata:
  name: unsigned-workload-violation
  namespace: default
  labels:
    app.kubernetes.io/name: test-unsigned
spec:
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
  containers:
    - name: api
      image: ghcr.io/ekrmcakir/unsigned-service:v1.0.0
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop:
            - ALL
