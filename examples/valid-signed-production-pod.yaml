apiVersion: v1
kind: Pod
metadata:
  name: payment-service-compliant
  namespace: default
  labels:
    app.kubernetes.io/name: payment-service
    app.kubernetes.io/env: production
    security.zero-trust.io/signed: "true"
spec:
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    fsGroup: 10001
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: payment-api
      image: ghcr.io/ekrmcakir/signed-payment-service:v2.4.0@sha256:7f83b1657ff1fc53b92dc18148a1d65dfc2d4b1fa3d677284addd200126d9069
      imagePullPolicy: IfNotPresent
      securityContext:
        allowPrivilegeEscalation: false
        privileged: false
        readOnlyRootFilesystem: true
        capabilities:
          drop:
            - ALL
      resources:
        limits:
          cpu: "500m"
          memory: "512Mi"
        requests:
          cpu: "100m"
          memory: "128Mi"
      ports:
        - containerPort: 8080
          name: http
