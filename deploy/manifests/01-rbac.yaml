apiVersion: v1
kind: ServiceAccount
metadata:
  name: zero-trust-webhook
  namespace: zero-trust-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: zero-trust-webhook-role
rules:
  - apiGroups: [""]
    resources: ["pods", "namespaces", "configmaps", "secrets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: zero-trust-webhook-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: zero-trust-webhook-role
subjects:
  - kind: ServiceAccount
    name: zero-trust-webhook
    namespace: zero-trust-system
