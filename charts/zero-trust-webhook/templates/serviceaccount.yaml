{{- if .Values.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "zero-trust-webhook.serviceAccountName" . | default "zero-trust-webhook" }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: zero-trust-webhook
    app.kubernetes.io/instance: {{ .Release.Name }}
{{- end }}
