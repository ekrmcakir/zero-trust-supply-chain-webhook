apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: pod-security-restricted
  annotations:
    policies.kyverno.io/title: Enforce Pod Security Standards (Restricted)
    policies.kyverno.io/category: Pod Security Standards
    policies.kyverno.io/severity: high
    policies.kyverno.io/description: >-
      Enforces the Kubernetes Restricted Pod Security Standard: non-root, read-only
      root filesystem, drop all Linux capabilities, and no privilege escalation.
spec:
  validationFailureAction: Enforce
  rules:
    - name: check-restricted-security
      match:
        any:
          - resources:
              kinds:
                - Pod
              namespaces:
                - "!kube-system"
                - "!zero-trust-system"
      validate:
        message: "Pod violates Zero-Trust Restricted profile. Containers must run as non-root, drop ALL capabilities, and have readOnlyRootFilesystem."
        pattern:
          spec:
            =(securityContext):
              =(runAsNonRoot): true
            containers:
              - securityContext:
                  allowPrivilegeEscalation: false
                  privileged: false
                  readOnlyRootFilesystem: true
                  capabilities:
                    drop:
                      - ALL
